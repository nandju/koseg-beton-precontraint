name: Deploy to LWS cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build
        env:
          NODE_ENV: production

      - name: Prepare static deployment files
        run: |
          mkdir -p deploy
          # Copy static export (Next.js generates 'out' directory for static export)
          if [ -d "out" ]; then
            echo "Copying static export from 'out' directory"
            cp -r out/* deploy/
          else
            echo "Error: 'out' directory not found. Build may have failed."
            exit 1
          fi
          # List files for debugging
          echo "=== Files in deploy directory ==="
          ls -la deploy/ | head -20
          echo "=== Total files count ==="
          find deploy -type f | wc -l
          echo "=== Sample HTML files ==="
          find deploy -name "*.html" | head -5

      - name: Deploy to LWS via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.koseg-ci.com
          username: c2651735c@koseg-ci.com
          password: 4mYGMqpJYbhfWxV
          local-dir: ./deploy/
          server-dir: /website2/
          dangerous-clean-slate: false
          log-level: verbose
